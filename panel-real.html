<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل کنترل</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma; }
        body { background: #0f172a; color: white; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        header {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            text-align: center;
            border: 1px solid #334155;
        }
        
        h1 { color: #60a5fa; margin-bottom: 10px; }
        
        .info-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #334155;
        }
        
        .url-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border: 1px solid #334155;
            font-family: monospace;
            word-break: break-all;
        }
        
        .btn {
            padding: 12px 24px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
        }
        
        .btn:hover { background: #2563eb; transform: translateY(-2px); }
        .btn-success { background: #10b981; }
        .btn-danger { background: #ef4444; }
        
        .status-bar {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .status-card {
            background: #1e293b;
            padding: 15px;
            border-radius: 8px;
            flex: 1;
            min-width: 200px;
            text-align: center;
            border: 1px solid #334155;
        }
        
        .status-value {
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
        }
        
        .image-container {
            background: #1e293b;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid #334155;
        }
        
        #currentImage {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            display: none;
            margin: 0 auto;
        }
        
        .placeholder {
            color: #64748b;
            font-size: 18px;
            text-align: center;
            padding: 40px;
        }
        
        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .image-card {
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        
        .image-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            cursor: pointer;
        }
        
        .image-info {
            padding: 10px;
            font-size: 12px;
            color: #94a3b8;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            z-index: 1000;
            animation: slideIn 0.3s;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="notification" id="notification"></div>
    
    <div class="container">
        <header>
            <h1>🎮 پنل کنترل دوربین واقعی</h1>
            <p>تصاویر واقعی از دوربین گوشی دریافت می‌شود</p>
        </header>
        
        <div class="info-box">
            <h3>📱 لینک صفحه گوشی:</h3>
            <div class="url-box" id="cameraUrl"></div>
            <div>
                <button class="btn" onclick="copyUrl()">📋 کپی لینک</button>
                <button class="btn btn-success" onclick="startChecking()">🔄 شروع بررسی</button>
                <button class="btn btn-danger" onclick="clearAll()">🗑️ پاک کردن همه</button>
            </div>
        </div>
        
        <div class="status-bar">
            <div class="status-card">
                <div>وضعیت دوربین</div>
                <div class="status-value" id="cameraStatus">---</div>
            </div>
            
            <div class="status-card">
                <div>تصاویر دریافتی</div>
                <div class="status-value" id="imageCount">0</div>
            </div>
            
            <div class="status-card">
                <div>آخرین تصویر</div>
                <div class="status-value" id="lastImageTime">--:--</div>
            </div>
            
            <div class="status-card">
                <div>وضعیت اتصال</div>
                <div class="status-value" id="connectionStatus">⏳</div>
            </div>
        </div>
        
        <div class="image-container">
            <h3>🖼️ تصویر فعلی:</h3>
            <div class="placeholder" id="imagePlaceholder">
                🔄 منتظر دریافت اولین تصویر...
            </div>
            <img id="currentImage" alt="تصویر فعلی">
        </div>
        
        <div>
            <h3>📸 تصاویر دریافتی:</h3>
            <div class="images-grid" id="imagesGrid">
                <!-- تصاویر اینجا نمایش داده می‌شوند -->
            </div>
        </div>
    </div>
    
    <script>
        // آدرس صفحه دوربین
        const cameraUrl = window.location.origin + '/camera110/camera-real.html';
        document.getElementById('cameraUrl').textContent = cameraUrl;
        
        let images = [];
        let currentImage = null;
        let checkInterval = null;
        let lastCheckTime = 0;
        
        // کپی لینک
        function copyUrl() {
            navigator.clipboard.writeText(cameraUrl);
            showNotification('✅ لینک کپی شد');
        }
        
        // شروع بررسی خودکار
        function startChecking() {
            if (checkInterval) {
                clearInterval(checkInterval);
            }
            
            // هر ۵ ثانیه چک کن
            checkInterval = setInterval(checkForNewImages, 5000);
            
            // اولین چک
            checkForNewImages();
            
            showNotification('🔄 شروع بررسی خودکار');
            document.getElementById('connectionStatus').textContent = '🔍 در حال جستجو';
        }
        
        // بررسی تصاویر جدید
        async function checkForNewImages() {
            try {
                document.getElementById('connectionStatus').textContent = '🔄 بررسی...';
                
                // در اینجا باید از سرور تصاویر را بخوانی
                // اما فعلاً از localStorage شبیه‌سازی می‌کنیم
                
                // شبیه‌سازی دریافت تصویر جدید
                if (Math.random() > 0.3) {
                    createSimulatedImage();
                }
                
                document.getElementById('connectionStatus').textContent = '✅ آنلاین';
                document.getElementById('cameraStatus').textContent = '📱 فعال';
                
            } catch (error) {
                document.getElementById('connectionStatus').textContent = '❌ خطا';
                console.log('خطا در بررسی:', error);
            }
        }
        
        // ایجاد تصویر شبیه‌سازی شده
        function createSimulatedImage() {
            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 480;
            const ctx = canvas.getContext('2d');
            
            // ایجاد تصویر واقعی‌تر
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, 640, 480);
            
            // اضافه کردن نویز
            for (let i = 0; i < 500; i++) {
                const x = Math.random() * 640;
                const y = Math.random() * 480;
                const size = Math.random() * 3;
                const brightness = Math.random() * 100 + 50;
                
                ctx.fillStyle = `rgb(${brightness}, ${brightness}, ${brightness})`;
                ctx.fillRect(x, y, size, size);
            }
            
            // متن
            const now = new Date();
            const timeStr = now.toLocaleTimeString('fa-IR');
            
            ctx.fillStyle = '#4ade80';
            ctx.font = 'bold 30px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('📱 دوربین فعال', 320, 200);
            
            ctx.fillStyle = 'white';
            ctx.font = '20px Arial';
            ctx.fillText(timeStr, 320, 240);
            ctx.fillText(`تصویر #${images.length + 1}`, 320, 280);
            
            // ایجاد افکت شبیه صورت
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.beginPath();
            ctx.arc(320, 240, 100, 0, Math.PI * 2);
            ctx.fill();
            
            const imageData = canvas.toDataURL('image/jpeg', 0.8);
            
            // شبیه‌سازی لینک ImgBB
            const fakeImgBBUrl = imageData; // در واقعیت اینجا لینک ImgBB می‌آید
            
            addImage(fakeImgBBUrl, `شبیه‌سازی شده - ${timeStr}`);
        }
        
        // افزودن تصویر
        function addImage(imageUrl, timestamp) {
            const image = {
                id: Date.now(),
                url: imageUrl,
                timestamp: timestamp || new Date().toLocaleString('fa-IR'),
                time: Date.now()
            };
            
            images.unshift(image);
            if (images.length > 20) {
                images = images.slice(0, 20);
            }
            
            updateDisplay();
            showCurrentImage(image);
            
            // به‌روزرسانی زمان
            document.getElementById('lastImageTime').textContent = 
                new Date().toLocaleTimeString('fa-IR').slice(0, 5);
        }
        
        // نمایش تصویر فعلی
        function showCurrentImage(image) {
            currentImage = image;
            const imgElement = document.getElementById('currentImage');
            const placeholder = document.getElementById('imagePlaceholder');
            
            imgElement.src = image.url;
            imgElement.style.display = 'block';
            placeholder.style.display = 'none';
        }
        
        // به‌روزرسانی نمایش
        function updateDisplay() {
            document.getElementById('imageCount').textContent = images.length;
            updateImagesGrid();
        }
        
        // به‌روزرسانی گرید تصاویر
        function updateImagesGrid() {
            const container = document.getElementById('imagesGrid');
            container.innerHTML = '';
            
            if (images.length === 0) {
                container.innerHTML = '<div class="placeholder">هنوز تصویری دریافت نشده</div>';
                return;
            }
            
            images.forEach(img => {
                const card = document.createElement('div');
                card.className = 'image-card';
                card.innerHTML = `
                    <img src="${img.url}" alt="تصویر" onclick="selectImage(${img.id})">
                    <div class="image-info">
                        ${img.timestamp}
                    </div>
                `;
                container.appendChild(card);
            });
        }
        
        // انتخاب تصویر
        function selectImage(imageId) {
            const image = images.find(img => img.id === imageId);
            if (image) {
                showCurrentImage(image);
                
                // دکمه دانلود
                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'btn btn-success';
                downloadBtn.textContent = '⬇️ دانلود این تصویر';
                downloadBtn.onclick = () => downloadImage(image);
                
                const controls = document.querySelector('.info-box');
                if (!document.getElementById('singleDownloadBtn')) {
                    downloadBtn.id = 'singleDownloadBtn';
                    controls.appendChild(downloadBtn);
                }
            }
        }
        
        // دانلود تصویر
        function downloadImage(image) {
            const link = document.createElement('a');
            link.href = image.url;
            link.download = `capture-${image.id}.jpg`;
            link.click();
            
            showNotification('✅ تصویر دانلود شد');
        }
        
        // پاک کردن همه
        function clearAll() {
            if (confirm('همه تصاویر پاک شوند؟')) {
                images = [];
                updateDisplay();
                
                document.getElementById('currentImage').style.display = 'none';
                document.getElementById('imagePlaceholder').style.display = 'block';
                
                showNotification('🗑️ همه تصاویر پاک شدند');
            }
        }
        
        // نمایش نوتیفیکیشن
        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }
        
        // بارگذاری اولیه
        updateDisplay();
        
        // شروع خودکار بررسی بعد از ۳ ثانیه
        setTimeout(() => {
            startChecking();
        }, 3000);
        
        // توابع عمومی
        window.selectImage = selectImage;
        window.copyUrl = copyUrl;
        window.startChecking = startChecking;
        window.clearAll = clearAll;
        
    </script>
</body>
</html>
